<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-labelledby="fs-title fs-desc">
  <title id="fs-title">Devansh Chaturvedi Signature</title>
  <desc id="fs-desc">Devansh Chaturvedi — Engineering systems that scale. Designing experiences that delight.</desc>
  <defs>
    <linearGradient id="fs-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081A1D"/><stop offset="1" stop-color="#040F11"/>
    </linearGradient>
    <radialGradient id="fs-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0D9488" stop-opacity=".4"/><stop offset="1" stop-color="#081A1D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fs-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .fs-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .fs-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .fs-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .fs-draw { stroke-dasharray: 800; stroke-dashoffset: 800; animation: fs-draw 2s cubic-bezier(.65,0,.35,1) .4s forwards; }
    @keyframes fs-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .fs-draw { stroke-dashoffset: 0; } }
  </style>

  <rect width="1200" height="240" rx="20" fill="url(#fs-bg)"/>
  <rect width="1200" height="240" rx="20" fill="url(#fs-glow)"/>
  <rect x=".5" y=".5" width="1199" height="239" rx="19.5" fill="none" stroke="#2DD4BF" stroke-opacity=".22"/>

  <!-- Monogram emblem -->
  <g transform="translate(600 68)">
    <circle r="28" fill="#0A2226" stroke="#2DD4BF" stroke-opacity=".5" stroke-width="1.2"/>
    <circle r="22" fill="#0E2D32" stroke="#5EEAD4" stroke-opacity=".7"/>
    <text class="fs-mono" y="5" text-anchor="middle" font-size="13" font-weight="bold" fill="#F0FDFA">DC</text>
  </g>

  <!-- Quote -->
  <text class="fs-serif" x="600" y="142" text-anchor="middle" font-size="28" font-weight="300" letter-spacing="-.5" fill="#F0FDFA">
    Engineering systems that scale. <tspan font-style="italic" fill="#5EEAD4">Designing experiences that delight.</tspan>
  </text>
  <path class="fs-draw" d="M300 165 H900" stroke="url(#fs-line)" stroke-width="1"/>
  <text class="fs-mono" x="600" y="196" text-anchor="middle" font-size="11" letter-spacing="2.8" fill="#71A8A4">
    DEVANSH CHATURVEDI · 2026 · DRAKEFORUM.ME
  </text>
</svg>
