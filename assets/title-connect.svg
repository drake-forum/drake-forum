<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="06 Connect: Let's build something worth explaining.">
  <defs>
    <linearGradient id="tcn-line" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/><stop offset=".6" stop-color="#0D9488"/><stop offset="1" stop-color="#0D9488" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tcn-sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/><stop offset=".5" stop-color="#F0FDFA"/><stop offset="1" stop-color="#5EEAD4"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.4;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="tcn-pulse"><stop offset="0" stop-color="#F0FDFA"/><stop offset=".5" stop-color="#5EEAD4" stop-opacity=".7"/><stop offset="1" stop-color="#0D9488" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .tcn-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .tcn-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .tcn-in { animation: tcn-in 1.1s cubic-bezier(.16,1,.3,1) both; }
    .tcn-d2 { animation-delay: .2s; } .tcn-d3 { animation-delay: .45s; }
    .tcn-draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: tcn-draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes tcn-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes tcn-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .tcn-in { animation: none; } .tcn-draw { animation: none; stroke-dashoffset: 0; } }
  </style>
  <g class="tcn-in">
    <text class="tcn-mono" x="40" y="34" font-size="12" letter-spacing="3" fill="#2DD4BF"><tspan fill="#5EEAD4">06</tspan>   CONNECT</text>
  </g>
  <g class="tcn-in tcn-d2">
    <text class="tcn-serif" x="38" y="84" font-size="44" font-weight="300" letter-spacing="-1" fill="#F0FDFA">Let&#x27;s build <tspan font-style="italic" fill="url(#tcn-sheen)">something worth explaining.</tspan></text>
  </g>
  <g class="tcn-in tcn-d3">
    <text class="tcn-mono" x="1160" y="34" text-anchor="end" font-size="10.5" letter-spacing="2.4" fill="#71A8A4">GET IN TOUCH</text>
  </g>
  <path class="tcn-draw" d="M40 106 H1160" stroke="url(#tcn-line)" stroke-width="1"/>
  <circle cx="40" cy="106" r="7" fill="url(#tcn-pulse)" opacity="0">
    <animate attributeName="cx" values="40;1160" dur="6s" begin="2.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="6s" begin="2.3s" repeatCount="indefinite"/>
  </circle>
</svg>
