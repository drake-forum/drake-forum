<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="p1-t">
  <title id="p1-t">PolicyGuard AI: Turns long, dense policy documents into answers you can check.</title>
  <defs>
    <linearGradient id="p1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="p1-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p1-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".07"/>
    </pattern>
    <filter id="p1-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p1-clip"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <style>
    .p1-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p1-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p1-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p1-in { animation: p1-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p1-d1 { animation-delay: .15s; } .p1-d2 { animation-delay: .4s; }
    .p1-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p1-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p1-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p1-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p1-in { animation: none; } .p1-draw { animation: none; stroke-dashoffset: 0; } }
  </style>
  <g clip-path="url(#p1-clip)">
    <rect width="1200" height="300" fill="url(#p1-bg)"/>
    <rect x="720" width="480" height="300" fill="url(#p1-grid)"/>
    <rect width="1200" height="300" fill="url(#p1-glow)"/>
    <g class="p1-in p1-d1">
      <text class="p1-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#C77B9B">01 · AI · NLP · LLM · 2026</text>
      <text class="p1-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#F8F0F3">PolicyGuard AI</text>
      <text class="p1-sans" x="56" y="166" font-size="17" fill="#B6A3AC">Turns long, dense policy documents into answers you can check.</text>
      <line x1="56" y1="198" x2="660" y2="198" stroke="#C77B9B" stroke-opacity=".18"/>
    <g transform="translate(56 236)"><text class="p1-serif" font-size="34" font-weight="300" fill="#F8F0F3">500+</text><text class="p1-sans" y="24" font-size="12.5" fill="#B6A3AC">policy documents processed</text></g>
    <g transform="translate(261 236)"><text class="p1-serif" font-size="34" font-weight="300" fill="#F8F0F3">92%</text><text class="p1-sans" y="24" font-size="12.5" fill="#B6A3AC">accuracy</text></g>
    <g transform="translate(466 236)"><text class="p1-serif" font-size="34" font-weight="300" fill="#F8F0F3">60%</text><text class="p1-sans" y="24" font-size="12.5" fill="#B6A3AC">less manual review time</text></g>
    </g>
    <g class="p1-in p1-d2">
      <g transform="translate(870 46)">
        <rect x="-40" y="22" width="150" height="196" rx="10" fill="#27101C" stroke="#C77B9B" stroke-opacity=".2" transform="rotate(-9 35 120)"/>
        <rect x="-10" y="14" width="150" height="196" rx="10" fill="#2F1422" stroke="#C77B9B" stroke-opacity=".28" transform="rotate(-3 65 112)"/>
        <g transform="rotate(4 120 110)">
          <rect x="44" y="8" width="150" height="200" rx="10" fill="#331627" stroke="#C77B9B" stroke-opacity=".45"/>
          <g fill="#F8F0F3" fill-opacity=".16">
            <rect x="64" y="34" width="110" height="5" rx="2.5"/><rect x="64" y="52" width="90" height="5" rx="2.5"/>
            <rect x="64" y="88" width="110" height="5" rx="2.5"/><rect x="64" y="124" width="100" height="5" rx="2.5"/>
            <rect x="64" y="160" width="110" height="5" rx="2.5"/><rect x="64" y="178" width="70" height="5" rx="2.5"/>
          </g>
          <rect x="64" y="70" width="104" height="5" rx="2.5" fill="#E5B5C7" filter="url(#p1-glowf)"/>
          <rect x="64" y="142" width="74" height="5" rx="2.5" fill="#C77B9B" filter="url(#p1-glowf)"/>
          <rect x="46" y="10" width="146" height="40" fill="#E5B5C7" fill-opacity=".08">
            <animate attributeName="y" values="10;166;10" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
          </rect>
        </g>
        <g transform="translate(120 170)">
          <rect width="196" height="54" rx="10" fill="#190B12" fill-opacity=".92" stroke="#C77B9B" stroke-opacity=".35"/>
          <text class="p1-mono" x="14" y="22" font-size="10.5" fill="#F8F0F3">Q · key clauses?</text>
          <text class="p1-mono" x="14" y="40" font-size="10.5" fill="#E5B5C7">A · extracted from source</text>
        </g>
      </g>
    </g>
    <rect x=".5" y=".5" width="1199" height="299" rx="17.5" fill="none" stroke="#C77B9B" stroke-opacity=".2"/>
  </g>
</svg>
