<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p2-t">
  <title id="p2-t">Bitchord: Hi-Res Lossless Music Streaming App in Kotlin</title>
  <defs>
    <linearGradient id="p2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081A1D"/><stop offset="1" stop-color="#040F11"/>
    </linearGradient>
    <radialGradient id="p2-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#0D9488" stop-opacity=".65"/><stop offset="1" stop-color="#042F2E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p2-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#2DD4BF" stroke-opacity=".06"/>
    </pattern>
    <filter id="p2-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p2-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p2-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0FDFA"/><stop offset=".45" stop-color="#5EEAD4"/><stop offset="1" stop-color="#0D9488" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p2-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p2-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p2-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p2-in { animation: p2-fade 1.1s cubic-bezier(.16,1,.3,1) both; }
    .p2-d1 { animation-delay: .15s; } .p2-d2 { animation-delay: .4s; }
    .p2-chip { animation: p2-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p2-chip { from { opacity: 0; } to { opacity: 1; } }
    .p2-draw { stroke-dasharray: 680; stroke-dashoffset: 680; animation: p2-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p2-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes p2-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p2-in, .p2-chip { animation: none; } .p2-draw { animation: none; stroke-dashoffset: 0; } }
    .p2-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p2-trace 7s linear infinite; }
    @keyframes p2-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p2-trace { display: none; } }
  </style>
  <g clip-path="url(#p2-clip)">
    <rect width="1200" height="370" fill="url(#p2-bg)"/>
    <rect x="760" width="440" height="370" fill="url(#p2-grid)"/>
    <rect width="1200" height="370" fill="url(#p2-glow)"/>

    <!-- Left Content Zone: comfortably spaced and bounded before x=660 -->
    <g class="p2-in p2-d1">
      <text class="p2-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#2DD4BF">02 · KOTLIN &amp; ANDROID · HI-RES AUDIO · 2026</text>
      <text class="p2-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#F0FDFA">Bitchord</text>
      <text class="p2-sans" x="56" y="166" font-size="16" fill="#71A8A4">Audiophile music streaming with bit-perfect lossless decoding.</text>
      <text class="p2-mono" x="56" y="200" font-size="11.5" fill="#5EEAD4"><tspan fill="#2DD4BF">BUILT ›</tspan> Custom audio pipeline, bit-perfect DAC pass-through &amp; local cache</text>
      <line class="p2-draw" x1="56" y1="226" x2="660" y2="226" stroke="#2DD4BF" stroke-opacity=".3"/>
      
      <!-- Metrics Columns: perfectly spaced across x=56, x=250, x=480 -->
      <g transform="translate(56 266)">
        <text class="p2-serif" font-size="34" font-weight="300" fill="#F0FDFA">10 Lakh+</text>
        <text class="p2-sans" y="24" font-size="12" fill="#71A8A4">active listeners</text>
      </g>
      <g transform="translate(250 266)">
        <text class="p2-serif" font-size="30" font-weight="300" fill="#F0FDFA">192kHz <tspan font-size="20" fill="#5EEAD4">/ 24-bit</tspan></text>
        <text class="p2-sans" y="24" font-size="12" fill="#71A8A4">lossless FLAC stream</text>
      </g>
      <g transform="translate(480 266)">
        <text class="p2-serif" font-size="34" font-weight="300" fill="#F0FDFA">99.9%</text>
        <text class="p2-sans" y="24" font-size="12" fill="#71A8A4">crash-free sessions</text>
      </g>

      <!-- Tech Stack Badges -->
      <g class="p2-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="68" height="26" rx="13" fill="#0A2226" stroke="#2DD4BF" stroke-opacity=".35"/><text class="p2-mono" x="90" y="331" text-anchor="middle" font-size="11.5" fill="#5EEAD4">Kotlin</text></g>
      <g class="p2-chip" style="animation-delay:1.12s"><rect x="132" y="314" width="98" height="26" rx="13" fill="#0A2226" stroke="#2DD4BF" stroke-opacity=".35"/><text class="p2-mono" x="181" y="331" text-anchor="middle" font-size="11.5" fill="#5EEAD4">Android SDK</text></g>
      <g class="p2-chip" style="animation-delay:1.24s"><rect x="238" y="314" width="108" height="26" rx="13" fill="#0A2226" stroke="#2DD4BF" stroke-opacity=".35"/><text class="p2-mono" x="292" y="331" text-anchor="middle" font-size="11.5" fill="#5EEAD4">Audio Engine</text></g>
      <g class="p2-chip" style="animation-delay:1.36s"><rect x="354" y="314" width="92" height="26" rx="13" fill="#0A2226" stroke="#2DD4BF" stroke-opacity=".35"/><text class="p2-mono" x="400" y="331" text-anchor="middle" font-size="11.5" fill="#5EEAD4">Coroutines</text></g>
      <g class="p2-chip" style="animation-delay:1.48s"><rect x="454" y="314" width="118" height="26" rx="13" fill="#0A2226" stroke="#2DD4BF" stroke-opacity=".35"/><text class="p2-mono" x="513" y="331" text-anchor="middle" font-size="11.5" fill="#5EEAD4">Hi-Res Lossless</text></g>
    </g>

    <!-- Right Zone: Dedicated Screen Mockup securely positioned at x=860 (over 200px from text) -->
    <g class="p2-in p2-d2">
      <g transform="translate(860 45)">
        <!-- Sleek phone frame -->
        <rect width="260" height="280" rx="18" fill="#0A2226" stroke="#2DD4BF" stroke-opacity=".35"/>
        <rect x="16" y="22" width="228" height="130" rx="10" fill="#040F11" stroke="#2DD4BF" stroke-opacity=".2"/>
        
        <!-- Dancing Equalizer Spectrum Bars -->
        <g transform="translate(32 128)">
          <rect x="0" y="-10" width="8" height="10" rx="4" fill="#5EEAD4"><animate attributeName="height" values="10;70;25;85;10" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="-10;-70;-25;-85;-10" dur="1.2s" repeatCount="indefinite"/></rect>
          <rect x="18" y="-10" width="8" height="10" rx="4" fill="#2DD4BF"><animate attributeName="height" values="25;90;45;60;25" dur="1.0s" repeatCount="indefinite"/><animate attributeName="y" values="-25;-90;-45;-60;-25" dur="1.0s" repeatCount="indefinite"/></rect>
          <rect x="36" y="-10" width="8" height="10" rx="4" fill="#5EEAD4"><animate attributeName="height" values="50;30;85;20;50" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="-50;-30;-85;-20;-50" dur="1.4s" repeatCount="indefinite"/></rect>
          <rect x="54" y="-10" width="8" height="10" rx="4" fill="#14B8A6"><animate attributeName="height" values="15;75;40;95;15" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="-15;-75;-40;-95;-15" dur="1.1s" repeatCount="indefinite"/></rect>
          <rect x="72" y="-10" width="8" height="10" rx="4" fill="#5EEAD4"><animate attributeName="height" values="60;100;30;70;60" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="-60;-100;-30;-70;-60" dur="0.9s" repeatCount="indefinite"/></rect>
          <rect x="90" y="-10" width="8" height="10" rx="4" fill="#2DD4BF"><animate attributeName="height" values="30;80;60;25;30" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="-30;-80;-60;-25;-30" dur="1.3s" repeatCount="indefinite"/></rect>
          <rect x="108" y="-10" width="8" height="10" rx="4" fill="#5EEAD4"><animate attributeName="height" values="40;20;80;50;40" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="-40;-20;-80;-50;-40" dur="1.5s" repeatCount="indefinite"/></rect>
          <rect x="126" y="-10" width="8" height="10" rx="4" fill="#14B8A6"><animate attributeName="height" values="70;45;95;30;70" dur="1.0s" repeatCount="indefinite"/><animate attributeName="y" values="-70;-45;-95;-30;-70" dur="1.0s" repeatCount="indefinite"/></rect>
          <rect x="144" y="-10" width="8" height="10" rx="4" fill="#5EEAD4"><animate attributeName="height" values="20;85;35;65;20" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="-20;-85;-35;-65;-20" dur="1.2s" repeatCount="indefinite"/></rect>
          <rect x="162" y="-10" width="8" height="10" rx="4" fill="#2DD4BF"><animate attributeName="height" values="55;25;70;90;55" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="-55;-25;-70;-90;-55" dur="1.1s" repeatCount="indefinite"/></rect>
          <rect x="180" y="-10" width="8" height="10" rx="4" fill="#5EEAD4"><animate attributeName="height" values="35;65;20;80;35" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="-35;-65;-20;-80;-35" dur="1.4s" repeatCount="indefinite"/></rect>
        </g>

        <!-- Track playback details -->
        <text class="p2-serif" x="22" y="184" font-size="15" fill="#F0FDFA">Master Audio Stream</text>
        <text class="p2-mono" x="22" y="202" font-size="10.5" fill="#71A8A4">Direct DAC Pass-Through · FLAC</text>

        <rect x="22" y="222" width="216" height="4" rx="2" fill="#0E2D32"/>
        <rect x="22" y="222" width="136" height="4" rx="2" fill="#5EEAD4"/>
        <circle cx="158" cy="224" r="5" fill="#F0FDFA" filter="url(#p2-glowf)"/>
        <text class="p2-mono" x="22" y="244" font-size="10" fill="#2DD4BF">03:42</text>
        <text class="p2-mono" x="238" y="244" text-anchor="end" font-size="10" fill="#71A8A4">05:18</text>
      </g>
    </g>

    <rect class="p2-trace" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p2-trace)" stroke-width="2"/>
  </g>
</svg>
