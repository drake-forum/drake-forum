<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="p4-t">
  <title id="p4-t">Multi-Tenant SaaS: Many organisations, one database, no cross-tenant access.</title>
  <defs>
    <linearGradient id="p4-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="p4-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p4-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".07"/>
    </pattern>
    <filter id="p4-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p4-clip"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <style>
    .p4-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p4-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p4-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p4-in { animation: p4-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p4-d1 { animation-delay: .15s; } .p4-d2 { animation-delay: .4s; }
    .p4-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p4-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p4-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p4-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p4-in { animation: none; } .p4-draw { animation: none; stroke-dashoffset: 0; } }
  </style>
  <g clip-path="url(#p4-clip)">
    <rect width="1200" height="300" fill="url(#p4-bg)"/>
    <rect x="720" width="480" height="300" fill="url(#p4-grid)"/>
    <rect width="1200" height="300" fill="url(#p4-glow)"/>
    <g class="p4-in p4-d1">
      <text class="p4-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#C77B9B">04 · SAAS · SECURITY · 2026</text>
      <text class="p4-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#F8F0F3">Multi-Tenant SaaS</text>
      <text class="p4-sans" x="56" y="166" font-size="17" fill="#B6A3AC">Many organisations, one database, no cross-tenant access.</text>
      <line x1="56" y1="198" x2="660" y2="198" stroke="#C77B9B" stroke-opacity=".18"/>
    <g transform="translate(56 236)"><text class="p4-serif" font-size="34" font-weight="300" fill="#F8F0F3">50+</text><text class="p4-sans" y="24" font-size="12.5" fill="#B6A3AC">concurrent tenants</text></g>
    <g transform="translate(261 236)"><text class="p4-serif" font-size="34" font-weight="300" fill="#F8F0F3">0</text><text class="p4-sans" y="24" font-size="12.5" fill="#B6A3AC">unauthorised-access incidents</text></g>
    <g transform="translate(466 236)"><text class="p4-serif" font-size="34" font-weight="300" fill="#F8F0F3">&lt;2 min</text><text class="p4-sans" y="24" font-size="12.5" fill="#B6A3AC">setup, down from 45</text></g>
    </g>
    <g class="p4-in p4-d2">
      <g transform="translate(860 30)">
        <g transform="translate(0 200)">
          <animateTransform attributeName="transform" type="translate" values="0 200; 0 200; 0 200" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
          <path d="M0 0 L120 -46 L280 -46 L160 0 Z" fill="#451126" fill-opacity=".92" stroke="#E5B5C7" stroke-opacity=".7" stroke-dasharray="5 4"/>
          <text class="p4-mono" x="96" y="-17" font-size="10.5" fill="#F8F0F3" transform="skewX(-38) translate(14 0)">shared PostgreSQL</text>
        </g>
        <g transform="translate(0 158)">
          <animateTransform attributeName="transform" type="translate" values="0 158; 0 152; 0 158" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
          <path d="M0 0 L120 -46 L280 -46 L160 0 Z" fill="#27101C" fill-opacity=".92" stroke="#C77B9B" stroke-opacity=".45" />
          <text class="p4-mono" x="96" y="-17" font-size="10.5" fill="#F8F0F3" transform="skewX(-38) translate(14 0)">tenant_id = 01</text>
        </g>
        <g transform="translate(0 116)">
          <animateTransform attributeName="transform" type="translate" values="0 116; 0 104; 0 116" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
          <path d="M0 0 L120 -46 L280 -46 L160 0 Z" fill="#27101C" fill-opacity=".92" stroke="#C77B9B" stroke-opacity=".45" />
          <text class="p4-mono" x="96" y="-17" font-size="10.5" fill="#F8F0F3" transform="skewX(-38) translate(14 0)">tenant_id = 02</text>
        </g>
        <g transform="translate(0 74)">
          <animateTransform attributeName="transform" type="translate" values="0 74; 0 56; 0 74" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
          <path d="M0 0 L120 -46 L280 -46 L160 0 Z" fill="#27101C" fill-opacity=".92" stroke="#C77B9B" stroke-opacity=".45" />
          <text class="p4-mono" x="96" y="-17" font-size="10.5" fill="#F8F0F3" transform="skewX(-38) translate(14 0)">tenant_id = 03</text>
        </g>
      </g>
      <text class="p4-mono" x="1176" y="270" text-anchor="end" font-size="10.5" letter-spacing="1.5" fill="#B6A3AC">WHERE tenant_id = :tenant · 4-LEVEL JWT / RBAC</text>
    </g>
    <rect x=".5" y=".5" width="1199" height="299" rx="17.5" fill="none" stroke="#C77B9B" stroke-opacity=".2"/>
  </g>
</svg>
