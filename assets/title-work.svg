<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="03 Selected work: Products, not assignments.">
  <defs>
    <linearGradient id="tw-line" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/><stop offset=".6" stop-color="#0D9488"/><stop offset="1" stop-color="#0D9488" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tw-sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/><stop offset=".5" stop-color="#F0FDFA"/><stop offset="1" stop-color="#5EEAD4"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.4;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="tw-pulse"><stop offset="0" stop-color="#F0FDFA"/><stop offset=".5" stop-color="#5EEAD4" stop-opacity=".7"/><stop offset="1" stop-color="#0D9488" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .tw-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .tw-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .tw-in { animation: tw-in 1.1s cubic-bezier(.16,1,.3,1) both; }
    .tw-d2 { animation-delay: .2s; } .tw-d3 { animation-delay: .45s; }
    .tw-draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: tw-draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes tw-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes tw-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .tw-in { animation: none; } .tw-draw { animation: none; stroke-dashoffset: 0; } }
  </style>
  <g class="tw-in">
    <text class="tw-mono" x="40" y="34" font-size="12" letter-spacing="3" fill="#2DD4BF"><tspan fill="#5EEAD4">03</tspan>   SELECTED WORK</text>
  </g>
  <g class="tw-in tw-d2">
    <text class="tw-serif" x="38" y="84" font-size="44" font-weight="300" letter-spacing="-1" fill="#F0FDFA">Products, <tspan font-style="italic" fill="url(#tw-sheen)">not assignments.</tspan></text>
  </g>
  <g class="tw-in tw-d3">
    <text class="tw-mono" x="1160" y="34" text-anchor="end" font-size="10.5" letter-spacing="2.4" fill="#71A8A4">HIGH-TRAFFIC SYSTEMS</text>
  </g>
  <path class="tw-draw" d="M40 106 H1160" stroke="url(#tw-line)" stroke-width="1"/>
  <circle cx="40" cy="106" r="7" fill="url(#tw-pulse)" opacity="0">
    <animate attributeName="cx" values="40;1160" dur="6s" begin="2.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="6s" begin="2.3s" repeatCount="indefinite"/>
  </circle>
</svg>
