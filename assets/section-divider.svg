<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="1200" height="40" role="img" aria-label="Section divider">
  <defs>
    <linearGradient id="div-line" gradientUnits="userSpaceOnUse" x1="50" y1="0" x2="1150" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset=".3" stop-color="#701A3D"/>
      <stop offset=".5" stop-color="#C77B9B"/>
      <stop offset=".7" stop-color="#701A3D"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="div-pulse">
      <stop offset="0" stop-color="#F8F0F3"/>
      <stop offset=".4" stop-color="#E5B5C7" stop-opacity=".7"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .div-draw { stroke-dasharray: 1100; stroke-dashoffset: 1100; animation: div-draw 2.2s cubic-bezier(.65,0,.35,1) .2s forwards; }
    @keyframes div-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .div-draw { animation: none; stroke-dashoffset: 0; } }
  </style>
  <path class="div-draw" d="M50 20 H1150" stroke="url(#div-line)" stroke-width="1"/>
  <g transform="translate(600 20)">
    <rect x="-6" y="-6" width="12" height="12" fill="#10070C" stroke="#C77B9B" transform="rotate(45)">
      <animateTransform attributeName="transform" type="rotate" values="45;225;225" keyTimes="0;.3;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines=".65 0 .35 1; 0 0 1 1"/>
    </rect>
    <circle r="2" fill="#E5B5C7"/>
  </g>
  <circle cx="60" cy="20" r="10" fill="url(#div-pulse)" opacity="0">
    <animate attributeName="cx" values="60;1140" dur="7s" begin="2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/>
    <animate attributeName="opacity" values="0;.9;.9;0" keyTimes="0;.1;.9;1" dur="7s" begin="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
