<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p1-t">
  <title id="p1-t">HiAnime: Next-generation anime streaming platform</title>
  <defs>
    <linearGradient id="p1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081A1D"/><stop offset="1" stop-color="#040F11"/>
    </linearGradient>
    <radialGradient id="p1-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#0D9488" stop-opacity=".65"/><stop offset="1" stop-color="#042F2E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p1-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#2DD4BF" stroke-opacity=".06"/>
    </pattern>
    <filter id="p1-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p1-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p1-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0FDFA"/><stop offset=".45" stop-color="#5EEAD4"/><stop offset="1" stop-color="#0D9488" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p1-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p1-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p1-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p1-in { animation: p1-fade 1.1s cubic-bezier(.16,1,.3,1) both; }
    .p1-d1 { animation-delay: .15s; } .p1-d2 { animation-delay: .4s; }
    .p1-chip { animation: p1-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p1-chip { from { opacity: 0; } to { opacity: 1; } }
    .p1-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p1-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p1-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes p1-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p1-in, .p1-chip { animation: none; } .p1-draw { animation: none; stroke-dashoffset: 0; } }
    .p1-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p1-trace 7s linear infinite; }
    @keyframes p1-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p1-trace { display: none; } }
  </style>
  <g clip-path="url(#p1-clip)">
    <rect width="1200" height="370" fill="url(#p1-bg)"/>
    <rect x="760" width="440" height="370" fill="url(#p1-grid)"/>
    <rect width="1200" height="370" fill="url(#p1-glow)"/>

    <!-- Left Content Zone: strictly bounded from x=56 to x=640 -->
    <g class="p1-in p1-d1">
      <text class="p1-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#2DD4BF">01 · FULL-STACK WEB · STREAMING PLATFORM · 2026</text>
      <text class="p1-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#F0FDFA">HiAnime</text>
      <text class="p1-sans" x="56" y="166" font-size="17" fill="#71A8A4">Next-generation anime streaming platform engineered for massive traffic.</text>
      <text class="p1-mono" x="56" y="200" font-size="12" fill="#5EEAD4"><tspan fill="#2DD4BF">BUILT ›</tspan> Ultra-low latency streaming, custom video controls &amp; CDN distribution</text>
      <line class="p1-draw" x1="56" y1="226" x2="640" y2="226" stroke="#2DD4BF" stroke-opacity=".3"/>
      
      <g transform="translate(56 266)">
        <text class="p1-serif" font-size="34" font-weight="300" fill="#F0FDFA">100M+</text>
        <text class="p1-sans" y="24" font-size="12.5" fill="#71A8A4">streaming sessions</text>
      </g>
      <g transform="translate(256 266)">
        <text class="p1-serif" font-size="34" font-weight="300" fill="#F0FDFA">#1 Peaked</text>
        <text class="p1-sans" y="24" font-size="12.5" fill="#71A8A4">top streaming ranking</text>
      </g>
      <g transform="translate(480 266)">
        <text class="p1-serif" font-size="34" font-weight="300" fill="#F0FDFA">&lt;50ms</text>
        <text class="p1-sans" y="24" font-size="12" fill="#71A8A4">player init latency</text>
      </g>

      <g class="p1-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="62" height="26" rx="13" fill="#0A2226" stroke="#2DD4BF" stroke-opacity=".35"/><text class="p1-mono" x="87" y="331" text-anchor="middle" font-size="11.5" fill="#5EEAD4">React</text></g>
      <g class="p1-chip" style="animation-delay:1.12s"><rect x="126" y="314" width="76" height="26" rx="13" fill="#0A2226" stroke="#2DD4BF" stroke-opacity=".35"/><text class="p1-mono" x="164" y="331" text-anchor="middle" font-size="11.5" fill="#5EEAD4">Tailwind</text></g>
      <g class="p1-chip" style="animation-delay:1.24s"><rect x="210" y="314" width="92" height="26" rx="13" fill="#0A2226" stroke="#2DD4BF" stroke-opacity=".35"/><text class="p1-mono" x="256" y="331" text-anchor="middle" font-size="11.5" fill="#5EEAD4">JavaScript</text></g>
      <g class="p1-chip" style="animation-delay:1.36s"><rect x="310" y="314" width="76" height="26" rx="13" fill="#0A2226" stroke="#2DD4BF" stroke-opacity=".35"/><text class="p1-mono" x="348" y="331" text-anchor="middle" font-size="11.5" fill="#5EEAD4">HTML5</text></g>
      <g class="p1-chip" style="animation-delay:1.48s"><rect x="394" y="314" width="128" height="26" rx="13" fill="#0A2226" stroke="#2DD4BF" stroke-opacity=".35"/><text class="p1-mono" x="458" y="331" text-anchor="middle" font-size="11.5" fill="#5EEAD4">Video Delivery</text></g>
    </g>

    <!-- Right Zone: Completely isolated inside dedicated nested translate(830 55) -->
    <g class="p1-in p1-d2">
      <g transform="translate(830 55)">
        <!-- Streaming Player Mockup Card -->
        <rect width="320" height="250" rx="14" fill="#0A2226" stroke="#2DD4BF" stroke-opacity=".35"/>
        <rect x="0" y="0" width="320" height="34" rx="14" fill="#0E2D32"/>
        <circle cx="18" cy="17" r="4.5" fill="#EF4444" opacity=".8"/>
        <circle cx="32" cy="17" r="4.5" fill="#F59E0B" opacity=".8"/>
        <circle cx="46" cy="17" r="4.5" fill="#10B981" opacity=".8"/>
        <text class="p1-mono" x="160" y="21" text-anchor="middle" font-size="10.5" fill="#71A8A4">hianime · 1080p 60fps</text>

        <!-- Video viewport mockup -->
        <rect x="16" y="48" width="288" height="152" rx="8" fill="#040F11" stroke="#2DD4BF" stroke-opacity=".2"/>
        <!-- Play button icon -->
        <polygon points="152,112 152,136 172,124" fill="#5EEAD4" filter="url(#p1-glowf)"/>
        <circle cx="160" cy="124" r="22" fill="none" stroke="#5EEAD4" stroke-opacity=".4" stroke-width="1.5"/>

        <!-- Progress bar -->
        <rect x="16" y="216" width="288" height="4" rx="2" fill="#0E2D32"/>
        <rect x="16" y="216" width="180" height="4" rx="2" fill="#5EEAD4"/>
        <circle cx="196" cy="218" r="5" fill="#F0FDFA"/>
      </g>
    </g>

    <rect class="p1-trace" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p1-trace)" stroke-width="2"/>
  </g>
</svg>
